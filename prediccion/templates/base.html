<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FinPredict ML{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --border-subtle: #1f2937;
            --accent-cyan: #22d3ee;
            --accent-magenta: #e879f9;
        }
        body {
            background-color: var(--bg-main);
            color: #e2e8f0;
            font-family: 'Inter', system-ui, sans-serif;
            padding-top: 76px;
            min-height: 100vh;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .navbar-glass {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
        }
        .card-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        .btn-cyan {
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            border: none;
            color: #fff;
            font-weight: 600;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn-cyan:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            color: #fff;
        }
        .form-control {
            background-color: #0b0f19;
            border: 1px solid #334155;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0b0f19;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.18);
            color: #fff;
        }
        .table-dark {
            --bs-table-bg: #0b0f19;
            --bs-table-hover-bg: #1e293b;
            border-color: #1f2937;
        }
        .table-dark thead th {
            background-color: #161f33;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-glass fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'subir_datos' %}">
                <span style="color: var(--accent-cyan);">◈</span>
                <span>FinPredict</span>
                <span class="badge rounded-pill text-bg-dark border border-secondary font-mono" style="font-size: 0.65rem;">ML</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="{% url 'subir_datos' %}" class="nav-link text-secondary small fw-semibold">Datos</a>
                <a href="{% url 'resultados_prediccion' %}" class="nav-link text-secondary small fw-semibold">Dashboard</a>
                <span class="badge bg-dark border border-secondary px-3 py-2 text-info font-mono">
                    @{{ user.username }}
                </span>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Salir</button>
                </form>
            </div>
        </div>
    </nav>
    {% endif %}

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
